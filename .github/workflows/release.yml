name: build and release

# Builds OpenMS (develop, pinned in ci/openms.lock, vcpkg dependencies) and DIATraceExtractor on every release
# platform, runs the tests and a clean-environment smoke test of the installed tree, packages it, and publishes
# the packages on the GitHub release of the tag. Modelled on okohlbacher/diaspextract's build.yml: a source build
# at a pinned OpenMS commit, a gate that runs the shipped binary with nothing inherited from the runner, and the
# version line checked against the project version.
#
# First build per platform: 1-3 h (vcpkg compiles Arrow, Boost, Xerces, ... from source); the vcpkg binary cache
# and ccache make later runs 10-20 min. The Linux arm64 and Windows arm64 runners are not available on every
# plan and their toolchains are less travelled, so those two jobs do not block the release (continue-on-error);
# their packages are published when they succeed.
#
# Pushes to main and pull requests run the same build, tests, install, smoke tests and packaging on Linux x86_64
# only (all platforms through workflow_dispatch); nothing is published. A tag publishes the packages, a SHA256SUMS
# file and a build provenance attestation for every file (`gh attestation verify FILE -R OWNER/REPO`).
on:
  push:
    tags: ['V[0-9]*']
    branches: [main]
    paths-ignore: ['docs/**', 'results/**', '**.md', 'scripts/**', 'library/**']
  pull_request:
    paths-ignore: ['docs/**', 'results/**', '**.md', 'scripts/**', 'library/**']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to build (default: the dispatched ref)'
        required: false
        default: ''
      publish:
        description: 'Publish the packages on the GitHub release of the tag (needs a tag)'
        type: boolean
        default: false
      platforms:
        description: 'Comma-separated subset of linux-x86_64,linux-aarch64,macos-arm64,windows-x86_64,windows-arm64 (empty: all)'
        required: false
        default: ''

permissions:
  contents: read

# a newer push to the same branch or pull request supersedes a running build; tags always run to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  plan:
    name: platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          python3 - "${{ github.event.inputs.platforms }}" "${{ github.event_name }}" "${{ github.ref_type }}" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          want = [p.strip() for p in sys.argv[1].split(",") if p.strip()]
          if not want and (sys.argv[2] == "pull_request" or (sys.argv[2] == "push" and sys.argv[3] != "tag")):
              want = ["linux-x86_64"]   # continuous integration: one platform
          rows = [
            {"name": "linux-x86_64",   "os": "ubuntu-24.04",     "preset": "linux-x64-release",   "triplet": "x64-linux-dynamic",               "experimental": False},
            {"name": "linux-aarch64",  "os": "ubuntu-24.04-arm", "preset": "linux-arm64-release", "triplet": "arm64-linux-dynamic",             "experimental": False},
            {"name": "macos-arm64",    "os": "macos-15",         "preset": "macos-arm64-release", "triplet": "arm64-osx-dynamic-sysroot",       "experimental": False},
            {"name": "windows-x86_64", "os": "windows-2025",     "preset": "windows-x64-release", "triplet": "x64-windows-static-md-release",   "experimental": False, "vsarch": "x64",   "qtarch": "win64_msvc2022_64"},
            {"name": "windows-arm64",  "os": "windows-11-arm",   "preset": "windows-x64-release", "triplet": "arm64-windows-static-md-release", "experimental": False, "vsarch": "arm64", "qtarch": "win64_msvc2022_arm64", "pyarch": "x64"},
          ]
          rows = [r for r in rows if not want or r["name"] in want]
          print("matrix=" + json.dumps({"include": rows}))
          EOF

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Paths. On Windows everything vcpkg touches lives in short directories (C:/o, C:/vi, C:/bt, C:/pk): the
      # autotools ports (libiconv) stage into <packages>/<full install prefix>, and with the workspace path that
      # exceeds MAX_PATH; the \\?\ paths MSYS then produces are passed to cl.exe as unknown options.
      - name: Paths
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "OPENMS_SRC=C:/o" >> "$GITHUB_ENV"
            echo "OPENMS_BUILD=C:/o/build/${{ matrix.preset }}" >> "$GITHUB_ENV"
            echo "VCPKG_INSTALLED=C:/vi/${{ matrix.triplet }}" >> "$GITHUB_ENV"
          else
            echo "OPENMS_SRC=$GITHUB_WORKSPACE/OpenMS" >> "$GITHUB_ENV"
            echo "OPENMS_BUILD=$GITHUB_WORKSPACE/OpenMS/build/${{ matrix.preset }}" >> "$GITHUB_ENV"
            echo "VCPKG_INSTALLED=$GITHUB_WORKSPACE/OpenMS/build/${{ matrix.preset }}/vcpkg_installed/${{ matrix.triplet }}" >> "$GITHUB_ENV"
          fi
      - name: Check out the tool
        uses: actions/checkout@v7
        with:
          path: tool
          ref: ${{ github.event.inputs.ref || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Versions must agree (CMake project version = git tag)
        shell: bash
        run: |
          V=$(sed -n 's/^project(DIATraceExtractor VERSION \([0-9.]*\).*/\1/p' tool/CMakeLists.txt)
          echo "version=$V" >> "$GITHUB_ENV"
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          case "$REF" in
            V*) [ "$REF" = "V$V" ] || { echo "::error::tag $REF but CMake project version $V"; exit 1; } ;;
            *)  echo "not a tag ($REF): version $V" ;;
          esac

      - name: Check out OpenMS at the pinned commit
        shell: bash
        run: |
          REF=$(sed -n 's/^OPENMS_BASE=//p' tool/ci/openms.lock)
          git clone --filter=blob:none https://github.com/OpenMS/OpenMS.git "$OPENMS_SRC"
          git -C "$OPENMS_SRC" checkout "$REF"
          git -C "$OPENMS_SRC" submodule update --init --depth 1 vcpkg
          NOCOIN=""; [ "${{ matrix.name }}" = "windows-arm64" ] && NOCOIN=--no-coin
          python3 tool/ci/patch_openms_manifest.py "$OPENMS_SRC" $NOCOIN
          [ "${{ matrix.name }}" = "windows-arm64" ] && python3 tool/ci/patch_openms_arm64.py "$OPENMS_SRC" || true
          echo "openms=$(git -C "$OPENMS_SRC" rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # ---- platform dependencies (as OpenMS's own CI installs them) ----
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf autoconf-archive automake build-essential cmake \
            git libtool ninja-build patch pkg-config qt6-base-dev ccache
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        env: { HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1 }
        run: |
          bash "$OPENMS_SRC/tools/ci/deps-macos.sh" --skip-doc-deps --skip-gui-deps
          brew install ccache qtbase
      - name: Visual Studio shell (Windows; the runners carry Visual Studio 2026 only)
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2
        with: { arch: '${{ matrix.vsarch }}' }
      - name: Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qtarch }}
          cache: false
          archives: 'qtbase'
      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install -y --no-progress cmake ninja
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # Windows arm64: x64 Python under emulation, for which pyarrow has wheels (the comparison tests need it)
          architecture: ${{ matrix.pyarch || '' }}
      - name: "Python packages for the tests (no pyarrow wheel: the two comparison tests are skipped)"
        shell: bash
        run: |
          if python -m pip install --quiet --only-binary=:all: pyarrow pandas numpy; then echo "ctest_args=" >> "$GITHUB_ENV"
          else echo "::warning::no pyarrow wheel for this platform; skipping parity_with_openswath and determinism_compare"; echo "ctest_args=-E parity_with_openswath|determinism_compare" >> "$GITHUB_ENV"; fi

      # ---- caches: vcpkg's binary archives and ccache ----
      - name: vcpkg binary cache (restore)
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('tool/ci/openms.lock', 'tool/ci/patch_openms_manifest.py', 'tool/ci/overlay-ports/**', 'tool/ci/triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-
      - name: ccache (Windows too, as in OpenMS's CI; MSVC release builds carry no /Zi debug info)
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: openms-${{ matrix.name }}-${{ env.openms }}
          max-size: 2G

      # ---- OpenMS: library, CLI base, the two TOPP tools the parity tests need ----
      - name: Configure OpenMS
        shell: bash
        run: |
          EXTRA=()
          [ "$RUNNER_OS" = "macOS" ] && EXTRA+=("-DOpenMP_ROOT=$(brew --prefix libomp)")
          EXTRA+=("-DCMAKE_C_COMPILER_LAUNCHER=ccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
          [ "$RUNNER_OS" = "Windows" ] && EXTRA+=("-DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=C:/bt;--x-packages-root=C:/pk" "-DVCPKG_INSTALLED_DIR=C:/vi" "-DVCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/tool/ci/triplets" "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}" "-DVCPKG_OVERLAY_PORTS=$GITHUB_WORKSPACE/tool/ci/overlay-ports")
          [ "${{ matrix.name }}" = "windows-arm64" ] && EXTRA+=("-DVCPKG_MANIFEST_FEATURES=lp-glpk" "-DLP_SOLVER=GLPK")
          cd "$OPENMS_SRC"
          cmake --preset ${{ matrix.preset }} -DWITH_GUI=OFF -DWITH_THERMO_RAW=OFF -DWITH_OPENTIMS=OFF \
                -DENABLE_UPDATE_CHECK=OFF -DENABLE_DOCS=OFF -DOPENMS_BUILD_TESTS=OFF "${EXTRA[@]}"
      - name: vcpkg binary cache (save; also when a later step fails)
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('tool/ci/openms.lock', 'tool/ci/patch_openms_manifest.py', 'tool/ci/overlay-ports/**', 'tool/ci/triplets/**') }}
      - name: Build OpenMS
        shell: bash
        run: cmake --build "$OPENMS_BUILD" --target OpenMS OpenMS_CLI OpenSwathWorkflow TextExporter

      # ---- the tool ----
      - name: Configure the tool
        shell: bash
        run: |
          EXTRA=()
          [ "$RUNNER_OS" = "macOS" ] && EXTRA+=("-DOpenMP_ROOT=$(brew --prefix libomp)")
          EXTRA+=("-DCMAKE_C_COMPILER_LAUNCHER=ccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
          DEPS="$OPENMS_BUILD/lib;$OPENMS_BUILD/bin;$VCPKG_INSTALLED/lib;$VCPKG_INSTALLED/bin"
          [ "$RUNNER_OS" = "Windows" ] && DEPS="$DEPS;$QT_ROOT_DIR/bin"
          # Windows: the vcpkg dependencies are static, and several (zlib's static 'zs.lib', OpenSSL) are only found
          # through vcpkg's own find wrappers, so configure with OpenMS's vcpkg toolchain on the same installed tree
          # (classic mode: the tool has no manifest of its own).
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA+=("-DCMAKE_TOOLCHAIN_FILE=$OPENMS_SRC/vcpkg/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_MANIFEST_MODE=OFF"
                    "-DVCPKG_INSTALLED_DIR=C:/vi" "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}"
                    "-DVCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/tool/ci/triplets" "-DVCPKG_APPLOCAL_DEPS=OFF")
          fi
          cmake -S tool -B tool/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$OPENMS_BUILD;$VCPKG_INSTALLED" \
                -DODIA_OPENMS_SHARE="$OPENMS_SRC/share/OpenMS" -DODIA_DEP_DIRS="$DEPS" "${EXTRA[@]}"
      - name: Build the tool
        shell: bash
        run: cmake --build tool/build --target DIATraceExtractor OpenSwathXicToTraces MzMLToMzPeak
      - name: "Runtime DLL path for the tests (Windows: a missing DLL opens a loader dialog that blocks until the test times out)"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cygpath -w "$OPENMS_BUILD/bin" >> "$GITHUB_PATH"
          cygpath -w "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"
          echo "added to PATH:"; cat "$GITHUB_PATH"
      - name: Tests
        shell: bash
        run: ctest --test-dir tool/build --output-on-failure --no-tests=error --timeout 300 ${ctest_args}

      # ---- install, smoke test from a clean environment, package ----
      - name: "Diagnostics after a failure (Windows): DLL imports, --help and one extraction under a time limit, thread stacks if it hangs"
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          X=tool/build/DIATraceExtractor.exe; TD=tool/testdata/openms
          CDB=$(ls "/c/Program Files (x86)/Windows Kits/10/Debuggers/"*/cdb.exe 2>/dev/null | grep -i "${{ matrix.vsarch }}" | head -1)
          echo "cdb: ${CDB:-none}"
          dump() {   # dump <seconds> <log> -- cmd...: run cmd, dump all thread stacks if it is still alive after <seconds>
            local t=$1 log=$2; shift 3
            "$@" > "$log" 2>&1 & local p=$!
            for i in $(seq 1 $t); do kill -0 $p 2>/dev/null || break; sleep 1; done
            if kill -0 $p 2>/dev/null; then
              echo "::warning::still running after $t s: $*"
              W=$(cat /proc/$p/winpid 2>/dev/null)
              [ -n "$CDB" ] && [ -n "$W" ] && "$CDB" -pv -p "$W" -y "$PWD/tool/build" -c ".symfix+ c:\\sym;.reload;~*kn 40;q" 2>&1 | tail -400
              kill -9 $p 2>/dev/null; taskkill //F //PID "$W" 2>/dev/null || true
            fi
            echo "---- output of $*"; cat "$log" | tail -60
          }
          echo "---- DLLs the tool imports, and where they resolve"
          dumpbin -nologo -dependents "$X" | grep -i "\.dll" | while read -r dll; do echo "$dll -> $(where "$dll" 2>/dev/null | head -1 || echo NOT FOUND)"; done
          dump 60 help.log -- "$X" --help
          dump 180 traml.log -- "$X" -in $TD/OpenSwathWorkflow_1_input.mzML -lib $TD/OpenSwathWorkflow_1_input.TraML -rt_window -1 \
               -mz_tol 50 -mz_tol_ms1 50 -top_fragments 0 -scheme B -out diag.parquet -threads 1 -debug 2
      # ---- macOS: Developer ID signing and notarization (optional: without the MACOS_* secrets the tree is
      # relocated and ad-hoc signed). Secrets reach steps only through env; `if:` cannot test them.
      - name: macOS signing configuration
        id: sign
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          NOTARY: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_ID: ${{ secrets.MACOS_APPLE_ID }}
          NOTARY_TEAM: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::notice::no MACOS_CERTIFICATE_BASE64 -- the macOS package is ad-hoc signed"
            echo "sign=false" >> "$GITHUB_OUTPUT"; echo "notarize=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"
          if [ -n "$NOTARY" ] && [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_TEAM" ]; then echo "notarize=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::signing without notarizing -- Gatekeeper still refuses the package"; echo "notarize=false" >> "$GITHUB_OUTPUT"; fi
      - name: Import the Developer ID certificate
        id: signing
        if: steps.sign.outputs.sign == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KCPW="${MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"; echo "::add-mask::$KCPW"
          KC="$RUNNER_TEMP/odia-signing.keychain-db"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          keychains=(); while IFS= read -r k; do keychains+=("$k"); done < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychain -d user -s "$KC" "${keychains[@]}"
          security default-keychain -d user -s "$KC"
          IDENT=$(security find-identity -p codesigning -v "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$IDENT" ] || { security find-identity -p codesigning -v "$KC"; echo "::error::no Developer ID Application identity in the certificate"; exit 1; }
          if [ -n "$MACOS_SIGNING_IDENTITY" ] && [ "$MACOS_SIGNING_IDENTITY" != "$IDENT" ]; then
            echo "::error::MACOS_SIGNING_IDENTITY does not match the imported certificate ($IDENT)"; exit 1; fi
          echo "identity=$IDENT" >> "$GITHUB_OUTPUT"; echo "keychain=$KC" >> "$GITHUB_OUTPUT"
          echo "signing as: $IDENT"
      - name: Install the self-contained tree
        shell: bash
        run: |
          NAME="DIATraceExtractor-${version}-${{ matrix.name }}"
          echo "name=$NAME" >> "$GITHUB_ENV"
          cmake --install tool/build --prefix "$RUNNER_TEMP/stage/$NAME"
          du -sh "$RUNNER_TEMP/stage/$NAME"; ls "$RUNNER_TEMP/stage/$NAME"
      - name: "macOS: make the tree relocatable and sign it (Developer ID with hardened runtime, else ad hoc)"
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          MACOS_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: bash tool/ci/macos_relocate_sign.sh "$RUNNER_TEMP/stage/$name"
      - name: The installed tool runs from a clean environment and reports its version
        shell: bash
        run: |
          set -o pipefail
          T="$RUNNER_TEMP/stage/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            env -i SYSTEMROOT="$SYSTEMROOT" PATH="$SYSTEMROOT/System32" "$T/bin/DIATraceExtractor.exe" --help > help.txt 2>&1 || { cat help.txt; exit 1; }
          else
            env -i HOME="$HOME" "$T/bin/DIATraceExtractor" --help > help.txt 2>&1 || { cat help.txt; exit 1; }
          fi
          grep -q "^Version: ${version//./\\.} (OpenMS " help.txt || { echo "::error::version line wrong"; cat help.txt; exit 1; }
          head -4 help.txt
      - name: The installed tool extracts traces from a clean environment
        shell: bash
        run: |
          set -o pipefail
          T="$RUNNER_TEMP/stage/$name"; TD="$GITHUB_WORKSPACE/tool/testdata/openms"; O="$RUNNER_TEMP/smoke"; mkdir -p "$O"
          ARGS=(-in "$TD/OpenSwathWorkflow_1_input.mzML" -lib "$TD/OpenSwathWorkflow_1_input.TraML" -rt_window -1 -mz_tol 50 -mz_tol_ms1 50
                -top_fragments 0 -scheme B -threads 2 -out "$O/smoke.parquet" -out_tsv "$O/smoke.tsv")
          if [ "$RUNNER_OS" = "Windows" ]; then
            env -i SYSTEMROOT="$SYSTEMROOT" PATH="$SYSTEMROOT/System32" "$T/bin/DIATraceExtractor.exe" "${ARGS[@]}" > smoke.log 2>&1 || { cat smoke.log; exit 1; }
          else
            # macOS: Homebrew's libomp out of reach, so only the bundled one can satisfy the tool
            HB=$( [ "$RUNNER_OS" = macOS ] && brew --prefix libomp 2>/dev/null || true )
            [ -n "$HB" ] && sudo mv "$HB" "$HB.hidden"
            env -i HOME="$HOME" "$T/bin/DIATraceExtractor" "${ARGS[@]}" > smoke.log 2>&1; rc=$?
            [ -n "$HB" ] && sudo mv "$HB.hidden" "$HB"
            [ $rc -eq 0 ] || { cat smoke.log; exit 1; }
          fi
          grep -E "^Written:" smoke.log
          [ $(wc -l < "$O/smoke.tsv") -gt 100 ] || { echo "::error::smoke extraction wrote no traces"; cat smoke.log; exit 1; }
      - name: "macOS: notarize the signed tree"
        if: steps.sign.outputs.notarize == 'true'
        timeout-minutes: 60
        shell: bash
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/stage/$name" "$RUNNER_TEMP/tree.zip"
          bash tool/ci/notarize.sh "$RUNNER_TEMP/tree.zip"
      - name: Package
        shell: bash
        run: bash tool/ci/package.sh "$RUNNER_TEMP/stage" "$name" "$RUNNER_TEMP/out"
      - name: "macOS: sign, notarize and staple the disk image"
        if: steps.sign.outputs.notarize == 'true'
        timeout-minutes: 60
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          MACOS_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="$RUNNER_TEMP/out/$name.dmg"
          codesign --force --timestamp --keychain "$MACOS_KEYCHAIN" --sign "$MACOS_SIGN_IDENTITY" "$DMG"
          bash tool/ci/notarize.sh "$DMG"
          # stapling fetches the ticket from Apple's CDN, which drops connections now and then (error 68); retry
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple "$DMG" && break
            [ $attempt -eq 5 ] && { echo "::error::stapling failed $attempt times"; exit 1; }
            echo "staple attempt $attempt failed; retrying in $((attempt * 20)) s"; sleep $((attempt * 20))
          done
          xcrun stapler validate "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
      - name: "macOS: remove the signing keychain"
        if: always() && steps.signing.outputs.keychain != ''
        shell: bash
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.name }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}

  publish:
    name: publish on the release
    needs: build
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/V') || github.event.inputs.publish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release
      id-token: write        # the attestation's signing certificate
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with: { path: tool, ref: '${{ github.event.inputs.ref || github.ref }}' }
      - uses: actions/download-artifact@v8
        with: { path: packages, merge-multiple: true }
      - name: Homebrew formula from the macOS tarball
        shell: bash
        run: |
          V=$(sed -n 's/^project(DIATraceExtractor VERSION \([0-9.]*\).*/\1/p' tool/CMakeLists.txt)
          TAG="${{ github.event.inputs.ref || github.ref_name }}"
          shopt -s nullglob; MAC=""; for f in packages/DIATraceExtractor-*-macos-arm64.tar.gz; do MAC=$f; done
          if [ -n "$MAC" ]; then
            python3 tool/ci/formula.py "$V" "https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$MAC")" "$MAC" packages/diatraceextractor.rb
          fi
          ls -la packages
      - name: Checksums
        shell: bash
        run: cd packages && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance attestation for every file
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: packages/SHA256SUMS
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.ref || github.ref_name }}
          files: packages/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          append_body: true
          body: |
            Binary packages built by the release workflow (OpenMS develop at the commit in `ci/openms.lock`): unpack and run
            `bin/DIATraceExtractor` (Linux, macOS: a launcher that finds the bundled libraries; Windows: `bin\DIATraceExtractor.exe`).
            macOS: the `.dmg` holds the same folder; `diatraceextractor.rb` is the Homebrew formula for this release
            (`brew install --formula diatraceextractor.rb`, or through the tap `okohlbacher/odia`).
            `SHA256SUMS` lists every file's checksum (`sha256sum -c SHA256SUMS --ignore-missing`); each file carries a
            build provenance attestation (`gh attestation verify FILE -R ${{ github.repository }}`).
