<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="DIATraceExtractor" description="Extract fragment and MS1 isotope traces (XICs) of a spectral library from a DIA run. RT map, RT window, mass offsets and tolerances are measured from the run; uses all physical cores unless -threads is given.">
    <ITEM name="version" value="0.3.0" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;DIATraceExtractor&apos;">
      <ITEM name="in" value="" type="string" description="DIA run: centroided mzML, mzPeak (.mzpeak) or Thermo .raw." required="true" advanced="false" />
      <ITEM name="lib" value="" type="input-file" description="Spectral library: DIA-NN/DIALibGen .parquet or .tsv, OpenSWATH .tsv/.pqp/.TraML." required="false" advanced="false" />
      <ITEM name="out" value="" type="output-file" description="Traces (Parquet), one row per trace. The RT axes go to &lt;out stem&gt;.axes.parquet next to it." required="false" advanced="false" />
      <ITEM name="out_tsv" value="" type="output-file" description="Traces as a long TSV, one row per point (large)." required="false" advanced="false" />
      <ITEM name="out_stats" value="" type="output-file" description="Run statistics (JSON): calibration, the values used and their sources, stage times, memory." required="false" advanced="false" />
      <ITEM name="instrument" value="auto" type="string" description="Instrument whose defaults apply: auto (from the run&apos;s metadata) or its name, for runs whose metadata lack it. Sets the fragment tolerance as a multiple of the measured mass-error width: Astral 9, Orbitrap 9, timsTOF 4, TOF 4, others 6." required="false" advanced="false" />
      <ITEM name="ids" value="" type="input-file" description="Extract only these precursors (ids, one per line)." required="false" advanced="false" />
      <ITEM name="top_fragments" value="6" type="int" description="Most intense library fragments per precursor (0 = all)." required="false" advanced="false" restrictions="0:" />
      <ITEM name="rt_mode" value="auto" type="string" description="How library RT maps to the run: auto (fitted from the run itself; any library RT scale), minutes (library RT is run minutes, e.g. a library tuned to this run), seconds (run seconds). -rt_anchors or -rt_trafo select a given map instead." required="false" advanced="false" />
      <ITEM name="rt_window" value="0.0" type="double" description="Extract +- this many seconds around each precursor&apos;s mapped RT. 0 (default): measured from the run, along the gradient: 7 x the RT scatter of the calibration anchors about the RT map + 2 x their peak width (FWHM; both multiples from the instrument files). Negative: the whole run." required="false" advanced="false" />
      <ITEM name="mz_tol_ms2" value="0.0" type="double" description="Fragment tolerance, +- ppm. 0 (default): measured from the run (-mz_accuracy_ms2 x the fragment mass-error width)." required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="mz_tol_ms1" value="0.0" type="double" description="MS1 tolerance, +- ppm. 0 (default): measured from the run (-mz_accuracy_ms1 x the MS1 mass-error width)." required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="scheme" value="A" type="string" description="A (default): DIA-NN&apos;s extraction rules (max of the centroids in the window) with the measured mass correction. B: OpenSWATH&apos;s rules (sum of the centroids, MS1 isotopes at unit spacing, every isolation window containing the precursor, no mass correction); needs -mz_tol_ms2 and -mz_tol_ms1." required="false" advanced="false" restrictions="A,B" />
      <ITEM name="out_mzml" value="" type="output-file" description="Also write the run as a centroided mzML, one spectrum per isolation window (diaPASEF frames split by window, scans collapsed), for tools that do not read mzPeak. Without -out and -out_tsv only this is done and -lib is not needed." required="false" advanced="false" supported_formats="*.mzML" />
      <ITEM name="out_axes" value="" type="output-file" description="RT axes (Parquet) to join with the traces; default &lt;out stem&gt;.axes.parquet." required="false" advanced="true" />
      <ITEM name="out_calibration" value="" type="output-file" description="Calibration anchors (TSV), usable as -rt_anchors." required="false" advanced="true" />
      <ITEM name="run_name" value="" type="string" description="Run name in the output (default: the input file name without extension)." required="false" advanced="true" />
      <ITEM name="targets_only" value="false" type="bool" description="Skip library decoys." required="false" advanced="true" />
      <ITEM name="no_ms1" value="false" type="bool" description="No MS1 traces (fragments only)." required="false" advanced="true" />
      <ITEM name="ms1_isotopes" value="2" type="int" description="MS1 isotope peaks after the monoisotopic one (0: monoisotopic only)." required="false" advanced="true" restrictions="-1:200" />
      <ITEM name="ms1_axis" value="scans" type="string" description="MS1 traces on the MS1 scans (their own times, in the axes file) or interpolated onto the MS2 cycle axis (cycles)." required="false" advanced="true" restrictions="scans,cycles" />
      <ITEM name="rt_anchors" value="" type="input-file" description="Use this RT map instead: two columns, library RT and run RT (s); fitted with LOWESS." required="false" advanced="true" />
      <ITEM name="rt_trafo" value="" type="input-file" description="Use this RT map instead: trafoXML, library RT -&gt; run RT (s)." required="false" advanced="true" supported_formats="*.trafoXML" />
      <ITEM name="rt_trafo_invert" value="false" type="bool" description="The trafoXML maps run RT -&gt; library RT (as OpenSwathRTNormalizer writes it)." required="false" advanced="true" />
      <ITEM name="instrument_file" value="" type="input-file" description="Instrument defaults for this run from this file (keys: name, extends, mz_accuracy_ms2, mz_accuracy_ms1, rt_window_sigma, rt_window_fwhm), over the shipped files in &lt;prefix&gt;/share/DIATraceExtractor/instruments." required="false" advanced="true" supported_formats="*.yaml" />
      <ITEM name="mz_accuracy_ms2" value="0.0" type="double" description="Measured fragment tolerance = k x the robust width of the fragment mass errors. 0 (default): the instrument&apos;s (see -instrument)." required="false" advanced="true" restrictions="0.0:" />
      <ITEM name="mz_accuracy_ms1" value="0.0" type="double" description="Measured MS1 tolerance = k x the robust width of the MS1 mass errors. 0 (default): the instrument&apos;s (4 for every shipped instrument)." required="false" advanced="true" restrictions="0.0:" />
      <ITEM name="mz_calibration" value="auto" type="string" description="auto: correct the m/z by the offsets measured from the run. off: use -mz_offset_ms2 and -mz_offset_ms1 instead (needs -mz_tol_ms2 and -mz_tol_ms1)." required="false" advanced="true" restrictions="auto,off" />
      <ITEM name="mz_offset_ms2" value="0.0" type="double" description="Fragment m/z correction with -mz_calibration off (ppm added to the target)." required="false" advanced="true" />
      <ITEM name="mz_offset_ms1" value="0.0" type="double" description="MS1 m/z correction with -mz_calibration off (ppm added to the target)." required="false" advanced="true" />
      <ITEM name="encoding" value="float32" type="string" description="Trace intensities: float32, or log8 (1 byte per point, log-spaced over 6 decades below each trace&apos;s maximum)." required="false" advanced="true" restrictions="float32,log8" />
      <ITEM name="expand_rt" value="false" type="bool" description="Also write each trace&apos;s RT values in its row (larger file)." required="false" advanced="true" />
      <ITEM name="skip_empty" value="false" type="bool" description="Do not write traces that are all zero." required="false" advanced="true" />
      <ITEM name="write_parts" value="32" type="int" description="Parquet writers working in parallel on the one -out file (1: a single writer, slower for large libraries). Fixed, so that the output does not depend on -threads." required="false" advanced="true" restrictions="1:" />
      <ITEM name="unit_precursors" value="256" type="int" description="Precursors per parallel work unit." required="false" advanced="true" restrictions="1:" />
      <ITEM name="buffer_mb" value="512" type="int" description="Memory for extracted traces waiting to be written." required="false" advanced="true" restrictions="16:" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool (0 = all available cores)" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="calibration" description="Calibration from the run itself">
        <ITEM name="mz_model" value="linear" type="string" description="Mass correction: linear (offset + slope x m/z, kept only where the m/z dependence is material, else constant) or constant." required="false" advanced="true" restrictions="constant,linear" />
        <ITEM name="panel" value="0" type="int" description="Precursors sampled for calibration (0: 5% of the library)." required="false" advanced="true" restrictions="0:" />
        <ITEM name="search_ppm" value="50.0" type="double" description="First-pass mass search half width, before calibration." required="false" advanced="true" restrictions="0.1:" />
        <ITEM name="lowess_span" value="0.15" type="double" description="LOWESS span of the fitted RT map." required="false" advanced="true" restrictions="0.01:1.0" />
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
