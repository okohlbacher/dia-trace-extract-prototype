<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="DIATraceExtractor" description="Extract fragment and MS1 isotope traces (XICs) of a spectral library from a DIA run on one global RT (cycle) axis.">
    <ITEM name="version" value="0.2.11" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;DIATraceExtractor&apos;">
      <ITEM name="in" value="" type="string" description="DIA run: centroided mzML, mzPeak (.mzpeak) or Thermo .raw." required="true" advanced="false" />
      <ITEM name="lib" value="" type="input-file" description="Spectral library: DIA-NN/DIALibGen .parquet or .tsv, OpenSWATH .tsv/.pqp/.TraML (not needed with -out_mzml alone)." required="false" advanced="false" />
      <ITEM name="out" value="" type="output-file" description="Traces (Parquet, one row per trace on the global cycle axis)." required="false" advanced="false" />
      <ITEM name="out_axes" value="" type="output-file" description="Axes (Parquet): global cycle axis, exact acquisition times, MS1 scan times. Default with -out: &lt;out stem&gt;.axes.parquet." required="false" advanced="false" />
      <ITEM name="out_tsv" value="" type="output-file" description="Traces as long TSV (one row per point; large)." required="false" advanced="false" />
      <ITEM name="out_stats" value="" type="output-file" description="Run statistics (JSON): stages, wall/CPU, memory." required="false" advanced="false" />
      <ITEM name="ids" value="" type="input-file" description="Restrict to these precursor ids (one per line)." required="false" advanced="false" />
      <ITEM name="top_fragments" value="6" type="int" description="Fragments per precursor by library intensity (0 = all)." required="false" advanced="false" restrictions="0:" />
      <ITEM name="targets_only" value="false" type="bool" description="Skip library decoys." required="false" advanced="false" />
      <ITEM name="rt_mode" value="linear" type="string" description="Library RT -&gt; run seconds: identity (library in run seconds), minutes (library in run minutes), linear (-rt_intercept/-rt_slope), trafo (-rt_trafo), anchors (-rt_anchors), auto (calibrate from the run itself, see -calibration:*)." required="false" advanced="false" restrictions="identity,minutes,linear,trafo,anchors,auto" />
      <ITEM name="rt_intercept" value="0.0" type="double" description="Linear RT map intercept (seconds)." required="false" advanced="false" />
      <ITEM name="rt_slope" value="1.0" type="double" description="Linear RT map slope (seconds per library unit)." required="false" advanced="false" />
      <ITEM name="rt_trafo" value="" type="input-file" description="trafoXML mapping library RT -&gt; run RT (seconds)." required="false" advanced="false" supported_formats="*.trafoXML" />
      <ITEM name="rt_trafo_invert" value="false" type="bool" description="The trafoXML maps run -&gt; library RT (as OpenSwathRTNormalizer writes); invert it." required="false" advanced="false" />
      <ITEM name="rt_anchors" value="" type="input-file" description="Two columns: library RT, observed run RT (seconds)." required="false" advanced="false" />
      <ITEM name="rt_anchor_model" value="lowess" type="string" description="Model fitted to the anchors." required="false" advanced="false" restrictions="linear,b_spline,lowess,interpolated" />
      <ITEM name="rt_window" value="60.0" type="double" description="Half width (seconds) of the extraction window around the mapped RT; 0 = measured (99th percentile of the calibration anchors&apos; RT residuals plus the peak width); negative extracts the whole run." required="false" advanced="false" />
      <ITEM name="mz_sigma_ms2" value="0.0" type="double" description="Fragment tolerance as a multiple of the robust width (1.4826 x MAD) of the fragment mass errors measured from the run. 0 (default): by instrument class from the run&apos;s metadata -- Orbitrap/Astral 9, timsTOF 4, other TOF 4, unknown 6 (the trace-quality optima, docs/00-dossier.md section 7)." required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="mz_sigma_ms1" value="4.0" type="double" description="MS1 tolerance as a multiple of the robust width of the MS1 mass errors (4: the MS1-fragment co-elution optimum on Astral and timsTOF)." required="false" advanced="false" restrictions="0.1:" />
      <ITEM name="mz_tol" value="0.0" type="double" description="Fixed fragment tolerance, +- ppm (half width); overrides -mz_sigma_ms2 when &gt; 0." required="false" advanced="false" />
      <ITEM name="mz_tol_ms1" value="0.0" type="double" description="Fixed MS1 tolerance, +- ppm (half width); overrides -mz_sigma_ms1 when &gt; 0." required="false" advanced="false" />
      <ITEM name="mass_calibration" value="auto" type="string" description="auto (default): measure the fragment and MS1 mass offsets from the run (calibration anchors) and apply them instead of -mz_offset*." required="false" advanced="false" restrictions="off,auto" />
      <ITEM name="out_calibration" value="" type="output-file" description="Calibration anchors (TSV; usable as -rt_anchors)." required="false" advanced="false" />
      <ITEM name="out_mzml" value="" type="output-file" description="Write the loaded run as a centroided mzML with one spectrum per isolation window (diaPASEF frames split by mobility and collapsed across scans), e.g. for engines that read no mzPeak/.d." required="false" advanced="false" supported_formats="*.mzML" />
      <ITEM name="mz_offset" value="0.0" type="double" description="Fragment mass correction (ppm added to the target)." required="false" advanced="false" />
      <ITEM name="mz_offset_ms1" value="0.0" type="double" description="MS1 mass correction (ppm added to the target)." required="false" advanced="false" />
      <ITEM name="scheme" value="A" type="string" description="Extraction scheme. A (default): the options as given (DIA-NN&apos;s rules with the measured mass correction). B: OpenSWATH&apos;s rules as one preset, so that they cannot be half-applied: sum of the centroids in the window, MS1 isotopes at unit spacing, no mass correction (mass_calibration off; -mz_tol and -mz_tol_ms1 must be given)." required="false" advanced="false" restrictions="A,B" />
      <ITEM name="aggregation" value="max" type="string" description="Combine centroids within tolerance: max (default, as DIA-NN) or sum (as OpenSWATH)." required="false" advanced="false" restrictions="sum,max" />
      <ITEM name="ms1_axis" value="scans" type="string" description="MS1 traces on the MS1 scans (raw values; times on axes lane -2) or interpolated linearly onto the global cycle axis (cycles)." required="false" advanced="false" restrictions="scans,cycles" />
      <ITEM name="ms1_isotopes" value="2" type="int" description="MS1 isotopes after the monoisotope (-1 disables MS1)." required="false" advanced="false" restrictions="-1:200" />
      <ITEM name="ms1_isotope_spacing" value="charge" type="string" description="MS1 isotope k at mz + k*1.00336/z (charge) or at mz + k*1.00336 regardless of charge (unit; what OpenSWATH extracts)." required="false" advanced="false" restrictions="charge,unit" />
      <ITEM name="window_assignment" value="nearest" type="string" description="Precursor -&gt; isolation window: nearest (closest centre) or all (every window containing it, as OpenSWATH)." required="false" advanced="false" restrictions="nearest,all" />
      <ITEM name="encoding" value="float32" type="string" description="Trace intensities: float32 (exact) or log8 (1 byte per point, log-spaced below the per-trace maximum)." required="false" advanced="false" restrictions="float32,log8" />
      <ITEM name="log8_decades" value="6.0" type="double" description="Dynamic range of the log8 encoding (decades)." required="false" advanced="true" restrictions="0.1:" />
      <ITEM name="expand_rt" value="false" type="bool" description="Also write the RT list per trace row (convenience; larger file)." required="false" advanced="false" />
      <ITEM name="skip_empty" value="false" type="bool" description="Do not write traces that are all zero." required="false" advanced="false" />
      <ITEM name="ingest_threads" value="0" type="int" description="Threads for the mzML ingest (chunk parsing, also with 1; ODIA_MZML_PARSER=openms selects the serial streaming parser); 0 = min(-threads, 32): the parse is memory-bandwidth bound, measured flat beyond ~32 threads while CPU time keeps growing." required="false" advanced="true" restrictions="0:" />
      <ITEM name="out_shards" value="32" type="int" description="Parquet part files written concurrently; &gt; 1 makes -out a directory of part-NNN.parquet files (read as one table by pyarrow/DuckDB). Each part is written serially, so the part count caps write parallelism (8 parts capped a 7 M-precursor run at ~16 s; 32: ~7 s); row groups shrink with the count, keeping the writers&apos; buffered rows constant. Fixed default: the output does not depend on -threads." required="false" advanced="true" restrictions="1:" />
      <ITEM name="unit_precursors" value="256" type="int" description="Precursors per parallel work unit." required="false" advanced="true" />
      <ITEM name="buffer_mb" value="512" type="int" description="Trace buffer pool (pre-faulted, recycled): extracted traces live here until they are written. Units that do not fit wait for writes to free blocks." required="false" advanced="true" />
      <ITEM name="library_part_rows" value="65536" type="int" description="Library rows per streamed part (parts are read, planned and released while extraction runs; fixed, so the output does not depend on -threads)." required="false" advanced="true" />
      <ITEM name="run_name" value="" type="string" description="Run name in the output (default: input file stem)." required="false" advanced="false" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool (0 = all available cores)" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="calibration" description="Calibration from the run itself (-rt_mode auto, -mass_calibration auto)">
        <ITEM name="panel" value="0" type="int" description="Precursors sampled for calibration (stratified over library RT; never restricted by -ids); 0 = calibration:panel_fraction of the eligible precursors." required="false" advanced="true" />
        <ITEM name="panel_fraction" value="0.05" type="double" description="Share of the eligible precursors in the panel." required="false" advanced="true" restrictions="1.0e-06:1.0" />
        <ITEM name="search_ppm" value="50.0" type="double" description="First-pass mass search half width (uncalibrated). Later passes search +- calibration:search_factor x the measured accuracy around the measured offset." required="false" advanced="true" restrictions="0.1:" />
        <ITEM name="search_factor" value="3.0" type="double" description="Narrowing factor of the mass search (see search_ppm)." required="false" advanced="true" restrictions="1.0:" />
        <ITEM name="search_rounds" value="3" type="int" description="Maximum stage-2 passes (stops when the search window changes by less than 25%)." required="false" advanced="true" restrictions="1:" />
        <ITEM name="accuracy_rule" value="fixed" type="string" description="fixed: the tolerances are -mz_sigma_ms2/-mz_sigma_ms1 x the measured widths. curve: MS2 takes the multiple (of 2, 3, 4, 5, 6, 8) at which the calibration anchors&apos; all-fragment co-elution is highest (finds the Astral optimum, too wide on timsTOF)." required="false" advanced="true" restrictions="fixed,curve" />
        <ITEM name="mass_model" value="linear" type="string" description="Mass correction from the anchors: constant (median apex error) or linear (offset + slope x m/z, kept when the shift over the m/z range is material; otherwise constant). The tolerance is the width of the residuals about the model." required="false" advanced="false" restrictions="constant,linear" />
        <ITEM name="coverage" value="0.99" type="double" description="Share of the true apex matches inside the coverage half width." required="false" advanced="true" restrictions="0.5:0.9999" />
        <ITEM name="coverage_factor" value="1.3" type="double" description="Tolerance = this x the coverage half width (flank and weak-fragment centroids err more than apex centroids)." required="false" advanced="true" restrictions="0.5:" />
        <ITEM name="min_relative_intensity" value="0.0" type="double" description="Apex centroids below this share of the anchor&apos;s strongest fragment are left out of the mass model (0 = all)." required="false" advanced="true" restrictions="0.0:1.0" />
        <ITEM name="strict_min_fragments" value="5" type="int" description="Stage 1: fragments with signal at an anchor apex." required="false" advanced="true" restrictions="1:" />
        <ITEM name="strict_min_correlation" value="0.9" type="double" description="Stage 1: mean pairwise fragment correlation at an anchor apex." required="false" advanced="true" restrictions="-1.0:1.0" />
        <ITEM name="strict_min_cosine" value="0.85" type="double" description="Stage 1: cosine of sqrt(apex) vs sqrt(library) intensities." required="false" advanced="true" restrictions="-1.0:1.0" />
        <ITEM name="min_fragments" value="4" type="int" description="Stage 2: fragments with signal at an anchor apex." required="false" advanced="true" restrictions="1:" />
        <ITEM name="min_correlation" value="0.8" type="double" description="Stage 2: mean pairwise fragment correlation at an anchor apex." required="false" advanced="true" restrictions="-1.0:1.0" />
        <ITEM name="min_cosine" value="0.75" type="double" description="Stage 2: cosine of sqrt(apex) vs sqrt(library) intensities at an anchor apex." required="false" advanced="true" restrictions="-1.0:1.0" />
        <ITEM name="half_window_cycles" value="0" type="int" description="Co-elution window around a candidate apex (+- cycles); 0 = twice the median peak width (FWHM, cycles) of the stage-1 anchors, at least 3." required="false" advanced="true" restrictions="0:" />
        <ITEM name="seed_window_cycles" value="4" type="int" description="Stage-1 co-elution window when half_window_cycles is 0." required="false" advanced="true" restrictions="1:" />
        <ITEM name="anchor_fdr" value="0.0" type="double" description="Stage 2 accepts anchors above the score (correlation x cosine) at which decoys (fragment windows shifted by calibration:decoy_shift) are this share of the anchors; 0 = fixed min_correlation / min_cosine." required="false" advanced="true" restrictions="0.0:0.5" />
        <ITEM name="decoy_shift" value="0.4" type="double" description="m/z shift of the decoy fragment windows." required="false" advanced="true" restrictions="0.05:" />
        <ITEM name="candidates" value="5" type="int" description="Local maxima of the summed fragment trace tried per precursor." required="false" advanced="true" restrictions="1:" />
        <ITEM name="mode_bins" value="20" type="int" description="Library-RT bins of the initial RT curve (run-RT mode per bin)." required="false" advanced="true" restrictions="1:" />
        <ITEM name="mode_bandwidth" value="15.0" type="double" description="Half width (s) of the window that finds the run-RT mode per bin; anchors farther than 4 x this from the mode curve are dropped." required="false" advanced="true" restrictions="0.01:" />
        <ITEM name="min_window" value="30.0" type="double" description="Smallest stage-2 RT search half width (s); the width is max(4 sigma of the stage-1 fit, this)." required="false" advanced="true" restrictions="0.0:" />
        <ITEM name="lowess_span" value="0.15" type="double" description="LOWESS span of the RT model." required="false" advanced="true" restrictions="0.01:1.0" />
        <ITEM name="rejection_rounds" value="3" type="int" description="Refits of the RT model, each dropping anchors beyond max(3 sigma, calibration:min_reject)." required="false" advanced="true" restrictions="0:" />
        <ITEM name="min_reject" value="3.0" type="double" description="Smallest rejection distance (s) of the RT refits." required="false" advanced="true" restrictions="0.0:" />
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
