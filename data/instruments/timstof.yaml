# Bruker timsTOF (diaPASEF): measured on the ProteoBench diaPASEF benchmark, runs A01/B01 (report s5: fragment
# co-elution optimum k = 4-5; DIA-NN's own accuracy there is 4.4 sigma). With the intensity-dependent tolerance (the
# default since 0.5.0) k = 3 co-eluted 4-5% better than 4, but changes the calibration's mass search (docs/15 s9).
name: timsTOF
extends: tof
aliases: [timsTOF Pro, timsTOF Pro 2, timsTOF SCP, timsTOF HT, timsTOF Ultra, timsTOF fleX]
keywords: [tims]
# When several files match the run's instrument name, the highest priority wins (0.2.16 tested timsTOF first,
# then the Orbitraps, then other TOFs); then the most specific file, then the longest keyword.
priority: 2
mz_accuracy_ms2: 4
